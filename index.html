<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora-JS-Pablo-HG</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section>
        <header>
          <h1>Estándar</h1>
        </header>
        <article>
          <div class="operacion">
            <div class="op">
              <span></span>
              <span class="igual">=</span>
            </div>
            <input type="number" class="result" placeholder="0" />
          </div>
        </article>
        <article class="cal">
          <div class="operacion">%</div>
          <div class="operacion">CE</div>
          <div class="operacion">C</div>
          <div class="operacion">DEL</div>
          <div class="operacion">1/𝑥</div>
          <div class="operacion">𝑥²</div>
          <div class="operacion">²√𝑥</div>
          <div class="operacion">÷</div>
          <div class="operacion principal">7</div>
          <div class="operacion principal">8</div>
          <div class="operacion principal">9</div>
          <div class="operacion">×</div>
          <div class="operacion principal">4</div>
          <div class="operacion principal">5</div>
          <div class="operacion principal">6</div>
          <div class="operacion">-</div>
          <div class="operacion principal">1</div>
          <div class="operacion principal">2</div>
          <div class="operacion principal">3</div>
          <div class="operacion">+</div>
          <div class="operacion principal">+/-</div>
          <div class="operacion principal">0</div>
          <div class="operacion principal">,</div>
          <div class="operacion igual">=</div>
        </article>
      </section>
      <aside>
        <header>
          <h2>Historial</h2>
          <h2>Memoria</h2>
        </header>
        <hr />
        <div class="info">
          <div class="desc">
            <div class="text">
              <span>No hay historial todavía.</span>
            </div>
          </div>
          <div class="papelera">
            <svg
              class="papelera"
              xmlns="http://www.w3.org/2000/svg"
              fill="currentColor"
              class="bi bi-trash3"
              viewBox="0 0 16 16"
            >
              <path
                d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"
              />
            </svg>
          </div>
        </div>
      </aside>
    </main>
  </body>
  <!-- <img src="img/base.png" width="680" style="margin-right: 20px" /> -->

  <script src="index.js"></script>
</html>
